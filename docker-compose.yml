# Compose file: runs the mock FHIR server as one container.
# No top-level "version:" key. Compose v2 ignores it and warns when it is present.

# All containers in this file. Only one service today.
services:
  # The service name. Other containers on the same network would reach it by this name.
  mock-fhir:
    # Build the image from ./mock-fhir, which holds the Dockerfile.
    build: ./mock-fhir

    # Publish host port 8080 to container port 8080, written as host:container.
    ports:
      - "8080:8080"

    environment:
      # Issuer URL that the SMART discovery document advertises.
      # Uses the value from the shell when set, otherwise the default after ":-".
      ISSUER: ${ISSUER:-http://localhost:8081/realms/fhir}

    healthcheck:
      # Alpine has no curl, so probe with node's built-in fetch (available in Node 22).
      # The probe exits 0 on a 2xx response and 1 otherwise. Docker reads that exit code.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/.well-known/smart-configuration').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

      # Seconds between probes.
      interval: 5s

      # Seconds one probe may run before it counts as a failure.
      timeout: 3s

      # Consecutive failures allowed before the container is marked unhealthy.
      retries: 10

      # Seconds after start during which failures are ignored, so slow boots are not penalised.
      start_period: 5s
