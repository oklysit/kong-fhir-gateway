# Compose file: runs the mock FHIR server, the Keycloak login server and the Kong gateway in front of them.
# No top-level "version:" key. Compose v2 ignores it and warns when it is present.

# All containers in this file.
services:
  # The service name. Other containers on the same network would reach it by this name.
  mock-fhir:
    # Build the image from ./mock-fhir, which holds the Dockerfile.
    build: ./mock-fhir

    # No published ports here. Since PR 4 the mock is reachable only inside the Docker network,
    # through Kong. Host port 8080 was removed on purpose, so the only way in is Kong on 8000.

    environment:
      # Issuer URL that the SMART discovery document advertises.
      # Uses the value from the shell when set, otherwise the default after ":-".
      ISSUER: ${ISSUER:-http://localhost:8081/realms/fhir}

    healthcheck:
      # Alpine has no curl, so probe with node's built-in fetch (available in Node 22).
      # The probe exits 0 on a 2xx response and 1 otherwise. Docker reads that exit code.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/.well-known/smart-configuration').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

      # Seconds between probes.
      interval: 5s

      # Seconds one probe may run before it counts as a failure.
      timeout: 3s

      # Consecutive failures allowed before the container is marked unhealthy.
      retries: 10

      # Seconds after start during which failures are ignored, so slow boots are not penalised.
      start_period: 5s

  # Mock LLM: a fake OpenAI-compatible chat server. Kong's ai-proxy calls it on /ai/chat.
  # It has no key and returns fixed text. Nothing on the host reaches it directly.
  # Listed above kong, the service that calls it, so the mock's definition comes first in this file.
  mock-llm:
    # Build the image from ./mock-llm, which holds the Dockerfile and server.js.
    build: ./mock-llm

    # No ports: key on purpose. The mock is internal only, reachable by other containers
    # on the Docker network under the name mock-llm.

    healthcheck:
      # Same probe style as mock-fhir: node's built-in fetch, since the Alpine image has no curl.
      # The probe exits 0 on a 2xx response and 1 otherwise.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8082/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]

      # Seconds between probes.
      interval: 5s

      # Seconds one probe may run before it counts as a failure.
      timeout: 3s

      # Consecutive failures allowed before the container is marked unhealthy.
      retries: 10

      # Seconds after start during which failures are ignored, so slow boots are not penalised.
      start_period: 5s

  # Keycloak: the login server. It issues the JWTs that mock-fhir's ISSUER points at.
  # Demo only: synthetic users, plain-text dev admin, no TLS.
  keycloak:
    # Exact pinned tag. "26.8.1" exists on quay.io (checked against the quay.io tag API).
    # Never use "latest": a new image would change login behaviour without a commit.
    image: quay.io/keycloak/keycloak:26.8.1

    # "start-dev" runs Keycloak in development mode (plain HTTP, no TLS setup).
    # "--import-realm" loads every realm file found in /opt/keycloak/data/import at startup.
    command: start-dev --import-realm

    # Publish host port 8081 to container port 8080. Port 8080 is taken by mock-fhir on the host.
    ports:
      - "8081:8080"

    # The realm file is the only input. Read-only, so the container cannot edit it.
    # The realm file explains the clients and users. JSON cannot hold comments, so the
    # comments for it live here and in the file's displayName and client description.
    volumes:
      - ./keycloak/realm-fhir.json:/opt/keycloak/data/import/realm-fhir.json:ro

    environment:
      # Dev-only admin login for the Keycloak admin console. Synthetic, not a secret.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      # Public URL that Keycloak puts in the token "iss" claim.
      # It must equal the ISSUER that mock-fhir advertises: http://localhost:8081/realms/fhir.
      KC_HOSTNAME: http://localhost:8081

      # Turns on the health endpoints. They are served on the management port 9000.
      KC_HEALTH_ENABLED: "true"

    healthcheck:
      # Keycloak's image has no curl. This probe uses bash's /dev/tcp to open a raw TCP
      # socket to the management port 9000 and send one HTTP GET to /health/ready.
      # Chosen over a plain port check because a bound port does not mean Keycloak is ready.
      # The probe exits 0 only when the status line contains " 200 ".
      # bash is required: /dev/tcp is a bash feature that sh (dash) does not have.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]

      # Seconds between probes.
      interval: 10s

      # Seconds one probe may run before it counts as a failure.
      timeout: 5s

      # Consecutive failures allowed before the container is marked unhealthy.
      # 30 retries at 10s covers slow CI runners after the start period.
      retries: 30

      # Seconds after start during which failures are ignored. Keycloak takes a while to boot
      # and import the realm, so the first minute does not count against it.
      start_period: 60s

  # One-shot job. It asks Keycloak for the realm's public key and writes the finished Kong
  # config into a shared volume. It exits when done. Kong starts only after an exit code of 0.
  kong-config:
    # Small base image. render.sh needs curl and jq, which the command installs first.
    image: alpine:3.20

    # Do not ask Keycloak for its key until Keycloak reports healthy.
    depends_on:
      keycloak:
        condition: service_healthy

    volumes:
      # The kong folder, read-only: the template (kong.yml.tpl) and render.sh.
      - ./kong:/kong-src:ro
      # The shared named volume. render.sh writes the rendered kong.yml here.
      - kong-config:/out

    # Install curl and jq quietly, then run render.sh. The "&&" stops the run if the install fails.
    command:
      - sh
      - -c
      - apk add --no-cache curl jq >/dev/null && sh /kong-src/render.sh

  # Kong: the API gateway and the only public entry point (host port 8000).
  # It checks the Keycloak token, enforces scope and patient context, and answers its own
  # errors as FHIR OperationOutcome. It runs DB-less: it reads one file, the rendered kong.yml.
  kong:
    # Exact pinned tag, same reason as Keycloak: "latest" would change behaviour without a commit.
    image: kong:3.9.4

    environment:
      # DB-less mode. Kong keeps its config in the declarative file below, not in Postgres.
      KONG_DATABASE: "off"

      # Where Kong reads its config inside the container. The kong-config job writes this file.
      KONG_DECLARATIVE_CONFIG: /kong/config/kong.yml

      # "bundled" keeps Kong's own plugins. "fhir-guard" adds our plugin, mounted below.
      KONG_PLUGINS: bundled,fhir-guard

      # Admin API off. No port is opened for it, so nothing can change the running config.
      KONG_ADMIN_LISTEN: "off"

    volumes:
      # Our plugin code. Kong loads plugins from this Lua path. Read-only.
      - ./kong/plugins/fhir-guard:/usr/local/share/lua/5.1/kong/plugins/fhir-guard:ro
      # The rendered config from the shared volume. Read-only: Kong only reads it.
      - kong-config:/kong/config:ro

    depends_on:
      # Start only after kong-config has written kong.yml and exited with code 0.
      kong-config:
        condition: service_completed_successfully
      # Start only after the mock answers its own healthcheck, so no request reaches a dead upstream.
      mock-fhir:
        condition: service_healthy
      # Start only after the mock LLM answers its healthcheck, so the ai-proxy route never calls a dead upstream.
      mock-llm:
        condition: service_healthy

    ports:
      # The only published port. Host 8000 to container 8000. Admin and status ports are not published.
      - "8000:8000"

    healthcheck:
      # kong-health is a script built into the Kong image. The image has no curl, so this is the probe.
      # It checks that the nginx workers are running.
      test: ["CMD", "kong-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Named volume shared by kong-config (writes kong.yml) and kong (reads it).
volumes:
  kong-config:
