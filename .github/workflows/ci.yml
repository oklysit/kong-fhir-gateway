# CI workflow: unit tests plus a container check.
name: ci

# When the workflow runs.
on:
  # Every pull request.
  pull_request:
  # Pushes to main, for example after a merge.
  push:
    branches: [main]

# Least privilege: the workflow token may only read repository contents.
permissions:
  contents: read

jobs:
  # Unit and static tests. Needs no Docker.
  test:
    runs-on: ubuntu-latest
    steps:
      # Download the repository into the runner.
      - uses: actions/checkout@v4

      # Install Node 22, the same major version as the container base image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs `node --test`: the mock-fhir tests, the infra checks and the Keycloak checks.
      - run: npm test

  # Container proof: build the image, start the stack, and check it end to end through Kong.
  # No `needs:` key, so this job runs in parallel with `test`.
  compose:
    runs-on: ubuntu-latest
    steps:
      # Download the repository, which holds docker-compose.yml, mock-fhir/, keycloak/ and kong/.
      - uses: actions/checkout@v4

      # Build the image and start the containers. --wait blocks until every healthcheck
      # passes (mock-fhir, keycloak, kong), and the step fails if a container never becomes healthy.
      # The kong-config one-shot job must also finish with exit code 0 before Kong starts.
      - name: Start Kong, mock FHIR and Keycloak stack
        run: docker compose up -d --build --wait

      # Run the end-to-end checks through Kong on port 8000. The script requests its own Keycloak
      # tokens (for ada and ben, password grant, demo and CI only) and checks the token claims.
      # It covers the 401 and 403 answers, the scope and patient rules, the bypass probes, the
      # HEAD and OPTIONS denials, the discovery route, the closed ports 8080 and 8001, and the
      # 429 rate-limit check, which must run last. It exits non-zero on the first failed check.
      - name: Run end-to-end checks through Kong
        run: bash scripts/e2e.sh

      # Print the container logs only when an earlier step failed. This shows why the import,
      # the healthcheck, the config render or the gateway check went wrong. Nothing is printed on success.
      - name: Print service logs on failure
        if: failure()
        run: |
          docker compose logs keycloak
          docker compose logs kong-config
          docker compose logs kong

      # Stop and remove the containers. always() runs this step even when an earlier
      # step failed, so no stack is left running on the runner.
      - name: Tear down stack
        if: always()
        run: docker compose down
